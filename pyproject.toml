[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simcortex-fixedinit"
version = "0.1.0"
description = "Fixed-initialization MRI-only cortical surface deformation experiments derived from SimCortex."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Dowoo Kim" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "typer>=0.12",
  "numpy>=1.24",
  "pandas>=2.0",
  "nibabel>=5.2",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "tensorboard>=2.14",
  "trimesh>=4.0",
  "openpyxl>=3.1",
]

[project.urls]
"Source Code" = "https://github.com/dk1028/SimCortex_V3"
"Upstream SimCortex" = "https://github.com/Neuro-iX/SimCortex"

[project.optional-dependencies]
torch = ["torch>=2.0"]
deform-metrics = ["python-fcl", "pymeshlab"]
dev = ["pytest>=8"]

[project.scripts]
simcortex-fixedinit = "simcortex.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simcortex = [
  "configs/**/*.yaml",
]
