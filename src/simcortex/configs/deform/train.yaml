user_config: null

dataset:
  split_file: /path/to/datasets/splits/dataset_split.csv
  train_split_name: train
  val_split_name: val
  session_label: '01'
  space: MNI152
  roots:
    HCP_YA: /path/to/hcpya-u100/derivatives/sc-preproc
    OASIS1: /path/to/oasis-1/derivatives/sc-preproc
  surface_name:
    - lh_pial
    - lh_white
    - rh_pial
    - rh_white
  prob_clip_min: 0.0
  prob_clip_max: 1.0
  prob_gamma: 1.0
  strict_missing: true
  use_probability_map: false
  use_fixed_initial_surface: true
  fixed_template_root: null

  aug_prob: 0.3
  aug_rot_range_deg: 3.0
  aug_scale_range: 0.02
  aug_trans_range_mm: 1.0

  aug_intensity_prob: 0.3
  aug_bias_strength: 0.2
  aug_gain_range: 0.1
  aug_bright_range: 0.1
  aug_noise_std: 0.05

trainer:
  seed: 2025
  img_batch_size: 1
  grad_accum_steps: 4
  num_epochs: 600
  validation_interval: 5
  collision_interval: 5

  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

  points_per_image: 180000
  val_points_per_image: 150000

  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  log_level: INFO
  mesh_chunk: 4
  grad_clip_norm: 1.0

  scheduler_patience: 4
  scheduler_factor: 0.5
  scheduler_min_lr: 1.0e-6
  scheduler_threshold_mm: 0.0004
  scheduler_threshold_mode: abs
  scheduler_cooldown: 1

  early_stop_patience: 15
  early_stop_min_delta_mm: 0.0003
  resume_from: null

model:
  sigma: 1
  n_steps: 8
  inshape:
    - 184
    - 224
    - 184
  c_hid:
    - 8
    - 16
    - 32
    - 64
    - 128
    - 128
  c_in: 1
  gn_groups: 8
  dropout: 0.1
  init_ckpt: null
  init_strict: true

objective:
  chamfer_weight: 1.0
  chamfer_scale: 1.0

  edge_loss_weight: 2.5
  normal_weight: 0.25
  reg_warmup_epochs: 25

  # White-pial HD guardrail.
  hd_weight: 5.5
  hd_p: 0.05
  hd_lambda_mm: 0.75
  hd_points: 50000

  # Nearest-normal signed nesting proxy.
  signed_nested_weight: 8.0
  signed_margin_mm: 0.55
  signed_points: 50000

  pial_lr_hd_weight: 1.5
  pial_lr_hd_p: 0.05
  pial_lr_hd_lambda_mm: 1.0
  pial_lr_hd_points: 30000

checkpoint:
  alpha_wp: 0.03
  alpha_lr: 0.015
  rmse_guardrail_rel: 1.03
  min_delta_score: 0.0001
  require_collision_for_best: true

outputs:
  root: /path/to/simcortex-runs/deform/fixed_init
  allow_existing: false
